name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Montags 04:00 UTC — fängt neu bekanntgewordene CVEs in unveränderten Dependencies ab
    - cron: "0 4 * * 1"

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Code scanning on a private repo needs GitHub Advanced Security (paid
    # per active committer) — without it, "Analyze" fails with "Code
    # scanning is not enabled for this repository". continue-on-error keeps
    # that from blocking the rest of Security/main; if GHAS gets enabled
    # later, this job just starts passing with no further changes needed.
    continue-on-error: true
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Same as CodeQL: needs GitHub Advanced Security on a private repo
    # ("Dependency review is not supported on this repository").
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # On a pull_request run from Dependabot, GITHUB_TOKEN gets restricted
    # permissions regardless of the `permissions:` block below (GitHub's
    # own anti-supply-chain-attack measure) — gitleaks-action's own PR
    # commit lookup then 403s with "Resource not accessible by integration".
    # Doesn't affect push runs (e.g. after merging to main), which still
    # gate normally.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      security-events: write
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        continue-on-error: true
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
