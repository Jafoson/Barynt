name: Release PR

# Hält bei jedem Merge auf main einen PR `release/next` aktuell: die
# vorgeschlagene nächste Version (aus den Conventional Commits seit dem
# letzten Tag), releases/<version>.md (EN) + .de.md (DE) mit der
# automatisch erzeugten Änderungsliste und die angehobene package.json.
# Den handgeschriebenen Teil (Highlights, Bilder) bearbeitest du direkt im PR;
# ein erneuter Lauf schreibt nur den Block zwischen den `changes:`-Markern neu.
# Der Merge des PRs löst release.yml aus.
#
# Voraussetzung: Settings → Actions → General → „Allow GitHub Actions to
# create and approve pull requests“. Ein mit GITHUB_TOKEN erstellter PR
# startet keine weiteren Workflows (also auch nicht tests.yml); wer das
# braucht, legt das Secret RELEASE_TOKEN (PAT) an — es wird bevorzugt.

on:
  push:
    branches: [main]

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Update release PR
    runs-on: ubuntu-latest
    # Der Merge des Release-PRs selbst soll keinen neuen PR auslösen.
    if: ${{ !contains(github.event.head_commit.message, 'release/next') && !contains(github.event.head_commit.message, 'chore(release)') }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Handbearbeitete Release-Dateien (und Bilder) des offenen PRs zurückholen,
      # damit `prepare` darauf aufsetzt statt sie zu überschreiben.
      - name: Restore hand edits from the open release branch
        run: |
          if git ls-remote --exit-code --heads origin release/next >/dev/null 2>&1; then
            git fetch origin release/next
            git checkout origin/release/next -- releases
          fi

      - name: Propose release
        id: release
        run: bun scripts/release/cli.ts prepare

      - name: Push release branch and open or update the PR
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release/next
          git add package.json releases
          git commit -m "chore(release): v${VERSION}"
          git push --force origin release/next

          title="chore(release): v${VERSION}"
          if [ -n "$PREVIOUS" ]; then
            intro="Vorherige Version: v${PREVIOUS}."
          else
            intro="Erstes Release."
          fi
          body="${intro}

          Bearbeite \`releases/${VERSION}.md\` (EN) und \`releases/${VERSION}.de.md\` (DE): Highlights, Screenshots unter \`releases/assets/${VERSION}/\`. Die Liste zwischen den \`changes:\`-Markern wird bei jedem Merge auf main neu erzeugt, alles andere bleibt.

          Der Merge dieses PRs legt Tag \`v${VERSION}\` und das GitHub-Release an."

          number=$(gh pr list --head release/next --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head release/next --title "$title" --body "$body"
          fi
