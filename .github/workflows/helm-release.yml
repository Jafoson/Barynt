name: Helm Release

# Manuell ausgelöst statt bei jedem Push, aus demselben Grund wie
# docker-build.yml: ein Chart-Release ist ein bewusster Schritt, kein
# Nebeneffekt von CI-Rauschen. Nach dem allerersten Lauf muss das Package
# einmalig manuell auf "Public" gestellt werden (GitHub Packages → Chart →
# Package settings → Change visibility) — GHCR erstellt ein neues OCI-
# Package standardmäßig privat, unabhängig von der Sichtbarkeit des Repos
# selbst, und der GITHUB_TOKEN dieses Workflows kann das nicht setzen.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Chart-Version (überschreibt Chart.yaml, ohne führendes 'v')"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Package & push (OCI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.16.4"

      # Dieselbe Prüfung wie helm-lint.yml — ein kaputtes Chart soll nicht
      # erst am fehlgeschlagenen `helm install` bei jemand anderem auffallen.
      - name: helm lint
        run: helm lint deploy/helm/barynt

      - name: Determine chart version and OCI target
        id: vars
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version:[[:space:]]*//p' deploy/helm/barynt/Chart.yaml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GHCR paths are case-sensitive and must be lowercase — computed
          # once here so the push and the printed install command (Summary
          # step below) can't drift apart the way they did the first time
          # this ran (push correctly lowercased, the summary's copy-paste
          # command didn't and was broken as a result).
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package deploy/helm/barynt \
            --version "${{ steps.vars.outputs.version }}" \
            --destination /tmp/chart-package

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push chart
        run: |
          helm push /tmp/chart-package/barynt-${{ steps.vars.outputs.version }}.tgz \
            "oci://ghcr.io/${{ steps.vars.outputs.owner }}/charts"

      - name: Summary
        run: |
          echo "### Chart veröffentlicht" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "helm install barynt oci://ghcr.io/${{ steps.vars.outputs.owner }}/charts/barynt --version ${{ steps.vars.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
