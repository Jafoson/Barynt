name: Docker Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to the short commit SHA)"
        required: false
        type: string
      platforms:
        description: "Target platforms"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

jobs:
  vars:
    name: Determine build parameters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      image: ${{ steps.vars.outputs.image }}
      tags: ${{ steps.vars.outputs.tags }}
      migrate_image: ${{ steps.vars.outputs.migrate_image }}
      migrate_tags: ${{ steps.vars.outputs.migrate_tags }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Determine image tag and name
        id: vars
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # Separate image, not just a tag suffix on the app image: the
          # `latest` tag stays a plain, unambiguous "the app" reference for
          # anyone pulling by hand, and docker-compose.yml's `image:` lines
          # for `app`/`migrate` read the same either way.
          migrate_image="${image}-migrate"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "migrate_image=$migrate_image" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "$image:$tag"
            if [ "${{ github.ref_type }}" != "tag" ]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "migrate_tags<<EOF"
            echo "$migrate_image:$tag"
            if [ "${{ github.ref_type }}" != "tag" ]; then
              echo "$migrate_image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Ein Runner pro Zielplattform, statt QEMU-Emulation für den eigentlichen
      # Image-Build: `bun run build` (Next/SWC) unter voller Emulation lief
      # hier für linux/arm64, sobald die App über das Anfangs-Scaffold
      # hinausgewachsen war, viele Stunden statt Minuten und hing den Job
      # faktisch auf (siehe Run 34495749559 — nach ~5h noch bei "Build and
      # push"). Native arm64-GitHub-Runner (ubuntu-24.04-arm) beheben das.
      - name: Build platform matrix
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          include="[]"
          IFS=',' read -ra plats <<< "$PLATFORMS"
          for p in "${plats[@]}"; do
            case "$p" in
              linux/amd64) runner="ubuntu-24.04" ;;
              linux/arm64) runner="ubuntu-24.04-arm" ;;
              *)
                echo "::error::no native runner configured for platform '$p'"
                exit 1
                ;;
            esac
            include="$(jq -c --arg p "$p" --arg r "$runner" --arg s "${p//\//-}" \
              '. + [{platform: $p, runner: $r, slug: $s}]' <<< "$include")"
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  scan:
    name: Build & Scan (amd64)
    needs: vars
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Nur amd64, nur lokal geladen — Trivy kann kein Multi-Arch-Manifest
      # scannen, und diese Plattform läuft ohnehin nativ.
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ needs.vars.outputs.image }}:scan
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.vars.outputs.image }}:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-docker-image

  # Erst ab hier wird tatsächlich in die Registry geschrieben — nur wenn der
  # Scan oben bestanden hat. Ein Job pro Plattform, auf ihrem jeweils
  # nativen Runner (siehe "Build platform matrix" oben), Push nur by
  # digest — das eigentliche Manifest (mit den Tags) entsteht erst im
  # "merge"-Job.
  build:
    name: Build & Push (${{ matrix.platform }})
    needs: [vars, scan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.vars.outputs.matrix) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ needs.vars.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # The `builder` stage, published as its own image so docker-compose.yml's
      # `migrate` service can run `prisma migrate deploy` + the system-data
      # bootstrap (prisma/bootstrap.ts) straight from the registry — no git
      # clone, no local `next build`, on whatever box someone self-hosts this
      # on. Reusing the same cache scope as the app build above means this
      # only pays for the layers unique to `builder` (the full toolchain,
      # skipped by `app`'s final stage) — `deps` and everything before it are
      # already warm.
      - name: Build and push migrate image by digest
        id: build-migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          outputs: type=image,name=${{ needs.vars.outputs.migrate_image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export migrate digest
        run: |
          mkdir -p /tmp/migrate-digests
          digest="${{ steps.build-migrate.outputs.digest }}"
          touch "/tmp/migrate-digests/${digest#sha256:}"

      - name: Upload migrate digest
        uses: actions/upload-artifact@v7
        with:
          name: migrate-digests-${{ matrix.slug }}
          path: /tmp/migrate-digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest & sign
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download migrate digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/migrate-digests
          pattern: migrate-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args+=(-t "$t")
          done <<< "${{ needs.vars.outputs.tags }}"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf '${{ needs.vars.outputs.image }}@sha256:%s ' *)

      - name: Create migrate manifest list and push
        working-directory: /tmp/migrate-digests
        run: |
          tag_args=()
          while IFS= read -r t; do
            [ -n "$t" ] && tag_args+=(-t "$t")
          done <<< "${{ needs.vars.outputs.migrate_tags }}"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf '${{ needs.vars.outputs.migrate_image }}@sha256:%s ' *)

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # cosign resolves the tag to its digest before signing, so signing by
      # tag here still produces a digest-pinned signature.
      - name: Sign image (keyless)
        run: |
          cosign sign --yes "${{ needs.vars.outputs.image }}:${{ needs.vars.outputs.tag }}"
          cosign sign --yes "${{ needs.vars.outputs.migrate_image }}:${{ needs.vars.outputs.tag }}"
