name: Installer

# install.sh (the one-line installer and `barynt` CLI) and the compose files
# it installs. Runs when any of them, or the image they start, changes.
on:
  push:
    branches: ["**"]
    paths:
      - "install.sh"
      - "docker-compose.yml"
      - "Caddyfile"
      - "example.env"
      - "Dockerfile"
      - "docker/**"
      - "tests/installer/**"
      - ".github/workflows/installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "install.sh"
      - "docker-compose.yml"
      - "Caddyfile"
      - "example.env"
      - "Dockerfile"
      - "docker/**"
      - "tests/installer/**"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + script tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ShellCheck ships with the GitHub Ubuntu image.
      - name: shellcheck
        run: shellcheck --shell=sh --external-sources install.sh tests/installer/test.sh

      - name: Install dash
        run: sudo apt-get install -y --no-install-recommends dash

      # POSIX sh first: the installer has to run on Debian/Ubuntu's dash and
      # Alpine's busybox, not only on bash.
      - name: Script tests (dash)
        run: dash tests/installer/test.sh

      - name: Script tests (bash)
        run: bash tests/installer/test.sh

  e2e:
    name: install, back up, restore, uninstall (fresh Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image from this very commit — a release image wouldn't have the
      # changes under test (same build as helm-lint.yml's image job).
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: barynt:ci
          cache-from: type=gha,scope=linux-amd64

      # BARYNT_SOURCE: the compose files from the checkout instead of a
      # release download; BARYNT_IMAGE + --version ci: the image built above.
      # No --domain — a runner has no public name, so this is the local
      # mode (http://localhost:3000), which still starts the whole stack
      # including Caddy.
      - name: Install
        env:
          BARYNT_SOURCE: ${{ github.workspace }}
          BARYNT_IMAGE: barynt
        run: sh install.sh install --version ci --yes --dir "$RUNNER_TEMP/barynt"

      - name: The CLI is installed and reports healthy
        run: |
          command -v barynt
          barynt status | tee status.txt
          grep -q "Healthy" status.txt
          curl -fsS http://127.0.0.1:3000/api/health

      - name: .env has generated secrets and is private
        run: |
          env_file="$RUNNER_TEMP/barynt/.env"
          test "$(stat -c %a "$env_file")" = 600
          grep -Eq '^AUTH_SECRET="[0-9a-f]{64}"$' "$env_file"
          grep -Eq '^POSTGRES_PASSWORD="[0-9a-f]{64}"$' "$env_file"

      - name: A second run changes nothing
        env:
          BARYNT_SOURCE: ${{ github.workspace }}
          BARYNT_IMAGE: barynt
        run: |
          before=$(sha256sum "$RUNNER_TEMP/barynt/.env")
          sh install.sh install --yes --dir "$RUNNER_TEMP/barynt"
          test "$before" = "$(sha256sum "$RUNNER_TEMP/barynt/.env")"

      - name: Backup
        run: |
          barynt backup --output "$RUNNER_TEMP/backups"
          archive=$(ls "$RUNNER_TEMP"/backups/barynt-*.tar.gz)
          tar tzf "$archive" | tee contents.txt
          grep -q "database.dump" contents.txt
          grep -q "files.tar.gz" contents.txt
          grep -q "/env$" contents.txt
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Restore
        run: barynt restore "$ARCHIVE" --yes

      - name: doctor
        run: barynt doctor

      - name: Uninstall with --purge removes everything
        run: |
          barynt uninstall --purge --yes
          test ! -e "$RUNNER_TEMP/barynt"
          test ! -e /usr/local/bin/barynt
          test -z "$(docker ps -aq --filter name=orbit-)"

      - name: Logs on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/barynt" 2>/dev/null && docker compose --profile app ps -a && docker compose --profile app logs --tail 100 || true
