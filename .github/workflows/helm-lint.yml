name: Helm Lint

# Nur bei tatsächlichen Änderungen am Chart — kein Grund, das bei jedem
# Push im gesamten Repo mitlaufen zu lassen (anders als tests.yml).
on:
  push:
    branches: ["**"]
    paths:
      - "deploy/helm/barynt/**"
      - ".github/workflows/helm-lint.yml"
      - "Dockerfile"
      - "docker/**"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/barynt/**"
      - ".github/workflows/helm-lint.yml"
      - "Dockerfile"
      - "docker/**"

permissions:
  contents: read

jobs:
  lint:
    name: helm lint + template + kubeconform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: helm lint
        run: helm lint deploy/helm/barynt

      # Template-Tests ohne Cluster (deploy/helm/barynt/unittests): PDB,
      # Files-Ingress, NetworkPolicies, Backup, Scheduling-Felder, Probes.
      # v1.0.3: die letzte Version ohne `platformHooks` in ihrer plugin.yaml,
      # das kann Helm 3.16 (oben gepinnt) noch nicht lesen.
      - name: helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3
          helm unittest -f 'unittests/*_test.yaml' deploy/helm/barynt

      # Zwei Renderdurchläufe: die gebündelten Defaults (values.yaml) und
      # das externe Produktions-Beispiel (examples/values-production.yaml)
      # — beide Zweige jedes bedingten Templates (postgresql.enabled,
      # rustfs.enabled, ingress.enabled, ...) mindestens einmal geprüft.
      - name: helm template (defaults)
        run: helm template barynt deploy/helm/barynt > /tmp/rendered-default.yaml

      - name: helm template (production example)
        run: |
          helm template barynt deploy/helm/barynt \
            -f deploy/helm/barynt/examples/values-production.yaml \
            > /tmp/rendered-production.yaml

      # Alles Optionale auf einmal an, damit jedes neue Template mindestens
      # einmal durch kubeconform muss.
      - name: helm template (every optional feature on)
        run: |
          helm template barynt deploy/helm/barynt \
            --set ingress.enabled=true --set ingress.tls.enabled=true \
            --set ingress.filesHost=files.example.com \
            --set networkPolicy.enabled=true --set backup.enabled=true \
            --set autoscaling.enabled=true \
            --set nodeSelector.pool=apps --set 'imagePullSecrets[0].name=regcred' \
            --set priorityClassName=high \
            > /tmp/rendered-features.yaml

      - name: Set up kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: kubeconform (defaults)
        run: kubeconform -strict -summary /tmp/rendered-default.yaml

      - name: kubeconform (production example)
        run: kubeconform -strict -summary /tmp/rendered-production.yaml

      - name: kubeconform (every optional feature on)
        run: kubeconform -strict -summary /tmp/rendered-features.yaml

      # Der eigentliche GitOps-Vertrag: ArgoCD/Flux rendern IMMER per
      # `helm template`, nie mit Cluster-Zugriff — jede Kombination von
      # existingSecret-Feldern muss also schon hier, ohne kind-Cluster,
      # fehlerfrei durchlaufen. Ein früherer Versuch (postgresql.auth.
      # existingSecret komponierte DATABASE_URL per `lookup`) bestand exakt
      # diese Prüfung nicht — der kind-Job unten hätte es nie gefangen, weil
      # dort `lookup` funktioniert. Deckt zugleich die positive (beide
      # Felder gesetzt) und die negative Seite ab (nur das Postgres-Passwort
      # gesetzt muss mit einer klaren Meldung scheitern, nicht mit einer
      # kaputten DATABASE_URL).
      - name: helm template (postgresql.auth.existingSecret + externalDatabase paired, no cluster)
        run: |
          helm template barynt deploy/helm/barynt \
            --set postgresql.auth.existingSecret=barynt-db \
            --set externalDatabase.existingSecret=barynt-db \
            --set externalDatabase.existingSecretUrlKey=url >/dev/null

      - name: helm template (postgresql.auth.existingSecret WITHOUT externalDatabase must fail, no cluster)
        run: |
          if helm template barynt deploy/helm/barynt \
              --set postgresql.auth.existingSecret=barynt-db >/dev/null 2>err.log; then
            echo "::error::helm template hätte ohne externalDatabase.existingSecretUrlKey fehlschlagen müssen" >&2
            exit 1
          fi
          grep -q "externalDatabase.existingSecret/existingSecretUrlKey fehlt" err.log

      # Jede gebündelte Komponente (postgresql/redis/rustfs) soll sich
      # unabhängig von den anderen abschalten lassen (z. B. eigene S3-Bucket,
      # aber gebündelte Postgres/Redis behalten) — ohne die passende
      # Gegenstelle bricht das sonst erst als CreateContainerConfigError beim
      # Rollout, nicht beim Rendern. Positiv (Gegenstelle gesetzt) und negativ
      # (Gegenstelle vergessen, muss mit klarer Meldung scheitern) für beide.
      - name: helm template (rustfs disabled + s3.endpoint + s3.existingSecret, no cluster)
        run: |
          helm template barynt deploy/helm/barynt \
            --set rustfs.enabled=false \
            --set s3.endpoint=https://s3.example.com \
            --set s3.existingSecret=barynt-s3 >/dev/null

      - name: helm template (rustfs disabled + s3.endpoint WITHOUT s3.existingSecret must fail, no cluster)
        run: |
          if helm template barynt deploy/helm/barynt \
              --set rustfs.enabled=false \
              --set s3.endpoint=https://s3.example.com >/dev/null 2>err.log; then
            echo "::error::helm template hätte ohne s3.existingSecret fehlschlagen müssen" >&2
            exit 1
          fi
          grep -q "s3.existingSecret fehlt" err.log

      - name: helm template (redis disabled + externalRedis.host, no cluster)
        run: |
          helm template barynt deploy/helm/barynt \
            --set redis.enabled=false \
            --set externalRedis.host=redis.example.com >/dev/null

      - name: helm template (redis disabled WITHOUT externalRedis.host must fail, no cluster)
        run: |
          if helm template barynt deploy/helm/barynt \
              --set redis.enabled=false >/dev/null 2>err.log; then
            echo "::error::helm template hätte ohne externalRedis.host fehlschlagen müssen" >&2
            exit 1
          fi
          grep -q "externalRedis.host fehlt" err.log

  # Das App-Image aus genau diesem Commit, für die kind-Jobs unten. Vorher
  # zogen sie `ghcr.io/barynt-dev/barynt:<appVersion>` — direkt nach dem
  # Hochsetzen der Chart-Version gibt es dieses Tag noch nicht (der
  # Docker-Build läuft erst nach dem Release), und beide Jobs scheiterten mit
  # ImagePullBackOff (1.0.12). Gleicher Build wie docker-build.yml (Ziel
  # `runner`, amd64, derselbe GHA-Cache), nur nicht gepusht.
  image:
    name: build app image for kind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          tags: barynt:ci
          outputs: type=docker,dest=/tmp/barynt-image.tar
          cache-from: type=gha,scope=linux-amd64

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: barynt-image
          path: /tmp/barynt-image.tar
          retention-days: 1

  restricted-pss:
    name: install against a restricted-PSS namespace (kind)
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      # Nur helm-lint/-template/kubeconform oben prüfen Syntax — ob das
      # Chart tatsächlich unter pod-security.kubernetes.io/enforce=restricted
      # hochkommt (BARY-29), lässt sich nur gegen einen echten API-Server
      # beantworten, nicht per `helm template`.
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: barynt-pss
          wait: 120s

      - name: Load the app image into kind
        uses: actions/download-artifact@v4
        with:
          name: barynt-image
          path: /tmp

      - name: kind load
        run: kind load image-archive /tmp/barynt-image.tar --name barynt-pss

      - name: Create restricted-PSS namespace
        run: |
          kubectl create ns barynt-pss
          kubectl label ns barynt-pss \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/warn=restricted

      - name: helm install --wait
        run: |
          helm install barynt deploy/helm/barynt -n barynt-pss --wait --timeout 5m \
            --set image.app.repository=barynt --set image.app.tag=ci \
            --set backup.enabled=true --set networkPolicy.enabled=true

      - name: helm test
        run: helm test barynt -n barynt-pss

      # Die Sicherung einmal wirklich laufen lassen — als uid 70 unter
      # restricted PSS, durch die NetworkPolicy zu Postgres hindurch.
      - name: Backup job runs
        run: |
          kubectl create job backup-now --from=cronjob/barynt-backup -n barynt-pss
          kubectl wait --for=condition=complete job/backup-now -n barynt-pss --timeout=180s
          kubectl logs job/backup-now -n barynt-pss | tee backup.log
          grep -q "Backup: /backups/barynt-" backup.log

      - name: Check for admission violations
        if: always()
        run: |
          if kubectl get events -n barynt-pss | grep -iE "violat|forbidden"; then
            echo "::error::Restricted PSS admission violation found (see above)" >&2
            exit 1
          fi

      - name: Debug output on failure
        if: failure()
        run: |
          kubectl get pods -n barynt-pss -o wide
          kubectl describe pods -n barynt-pss
          kubectl get events -n barynt-pss --sort-by=.lastTimestamp

  postgres-existing-secret:
    name: bundled Postgres with a pre-existing password (kind)
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      # Der lint-Job oben prüft schon per `helm template`, dass diese
      # Kombination ohne Cluster rendert (der eigentliche GitOps-Vertrag).
      # Was nur ein echter API-Server beantworten kann: kommt der Postgres-
      # Container mit dem vorgegebenen Passwort tatsächlich hoch, und
      # verbindet sich die App über die vom Betreiber mitgebrachte
      # DATABASE_URL erfolgreich damit (release-Name "barynt" ==
      # Chart-Name -> Postgres-Host ist "barynt-postgres", siehe
      # barynt.fullname).
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: barynt-pg-secret
          wait: 120s

      - name: Load the app image into kind
        uses: actions/download-artifact@v4
        with:
          name: barynt-image
          path: /tmp

      - name: kind load
        run: kind load image-archive /tmp/barynt-image.tar --name barynt-pg-secret

      - name: Create namespace and pre-existing Postgres secret (password + matching URL)
        run: |
          kubectl create ns barynt-pg-secret
          kubectl create secret generic my-postgres-secret -n barynt-pg-secret \
            --from-literal=password=CorrectHorseBatteryStaple \
            --from-literal=url="postgresql://barynt:CorrectHorseBatteryStaple@barynt-postgres:5432/barynt"

      - name: helm install --wait
        run: |
          helm install barynt deploy/helm/barynt -n barynt-pg-secret --wait --timeout 5m \
            --set image.app.repository=barynt --set image.app.tag=ci \
            --set postgresql.auth.existingSecret=my-postgres-secret \
            --set externalDatabase.existingSecret=my-postgres-secret \
            --set externalDatabase.existingSecretUrlKey=url

      # Beweist zwei Dinge zugleich: der Postgres-Container akzeptiert das
      # vorgegebene Passwort (barynt.postgresPasswordRef), und die App
      # verbindet sich über die vom Betreiber mitgebrachte DATABASE_URL
      # erfolgreich damit — ein grüner Rollout allein reicht dafür schon,
      # ohne das Passwort selbst irgendwo mitzuloggen.
      - name: helm test
        run: helm test barynt -n barynt-pg-secret

      - name: Generated secret must not contain a Postgres password or DATABASE_URL
        run: |
          data=$(kubectl get secret barynt-generated -n barynt-pg-secret -o jsonpath='{.data}')
          if echo "$data" | grep -qE "POSTGRES_PASSWORD|DATABASE_URL"; then
            echo "::error::Postgres-Passwort/DATABASE_URL wurden trotz existingSecret generiert/kopiert" >&2
            exit 1
          fi

      - name: Debug output on failure
        if: failure()
        run: |
          kubectl get pods -n barynt-pg-secret -o wide
          kubectl describe pods -n barynt-pg-secret
          kubectl get events -n barynt-pg-secret --sort-by=.lastTimestamp
