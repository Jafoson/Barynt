name: Feature request
description: An idea for something Barynt should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the situation, not yet the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Barynt to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds, other tools, other ways you considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - label: I would be happy to open a pull request for this.
