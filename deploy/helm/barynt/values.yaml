# Default-Werte für den Chart "barynt". Deckt sich bewusst mit dem, was
# docker-compose.yml lokal tut: alles gebündelt, per `helm install` ohne
# weitere Flags lauffähig. Für einen echten Produktions-Cluster siehe
# examples/values-production.yaml (externe DB/Redis/S3, Ingress+TLS).

nameOverride: ""
fullnameOverride: ""

image:
  app:
    repository: ghcr.io/jafoson/barynt
    # Leer = .Chart.AppVersion. In Produktion auf einen Commit-SHA oder Tag
    # pinnen statt "latest" zu übernehmen — reproduzierbare Rollouts/Rollbacks.
    tag: ""
    pullPolicy: IfNotPresent
  migrate:
    repository: ghcr.io/jafoson/barynt-migrate
    tag: ""
    pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Non-root, uid/gid 1000 — deckt sich mit dem "bun"-User, den das Dockerfile
# im Runner-Stage bereits verwendet (siehe Dockerfile, `USER bun`).
# seccompProfile ist Pflicht für die Pod Security Standard "restricted"
# (zusammen mit den container-seitigen Feldern unten in `securityContext`)
# und gehört auf den Pod, nicht in den Container-securityContext — die
# Kubernetes-API kennt `allowPrivilegeEscalation`/`capabilities` nur auf
# Container-Ebene, seccompProfile dagegen auf beiden; einmal hier gesetzt
# gilt es für alle Container im Pod (App + `migrate`-initContainer), ohne
# Wiederholung.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  # Beispiel für cert-manager (siehe examples/values-production.yaml):
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  host: issues.example.com
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Es gibt (noch) keinen dedizierten /api/health-Endpunkt — die Probes
# spiegeln exakt den bestehenden Docker-HEALTHCHECK (GET auf "/", <500 =
# gesund), siehe Dockerfile.
probes:
  path: /
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# AUTH_URL: Basis-URL der Anwendung (Auth.js-Callbacks, Einladungslinks).
# In Produktion erforderlich — ohne echten Wert zeigen Links auf localhost.
env:
  authUrl: ""

# AUTH_SECRET (Auth.js) — Pflichtwert, niemals im Klartext hier eintragen.
#   existingSecret gesetzt  -> wird unverändert referenziert.
#   existingSecret leer     -> der Chart generiert einmalig ein Secret
#                              "<fullname>-generated" (randAlphaNum, per
#                              `lookup` über Upgrades hinweg stabil).
auth:
  existingSecret: ""
  existingSecretKey: "AUTH_SECRET"

  # Generischer OIDC-/SSO-Provider (Keycloak, Authentik, Entra ID, Okta,
  # ...) — siehe auth.config.ts und example.env AUTH_OIDC_*. Ohne
  # issuer/clientId bleibt der Button aus, genau wie ohne die Env-Vars
  # außerhalb von Helm. Das Client-Secret wird nie generiert (externer IdP,
  # kein sinnvoller Default) — nur über existingSecret referenziert, landet
  # nie in der ConfigMap.
  oidc:
    issuer: ""
    clientId: ""
    name: ""
    existingSecret: ""
    existingSecretKey: "clientSecret"

  # Passkey-/Registrierungs-Schalter (siehe auth.config.ts) — Defaults
  # entsprechen dem heutigen App-Verhalten (alles offen). Nur der Literal
  # "false" schaltet ab; per Default wird deshalb gar keine der drei
  # AUTH_*_ENABLED-Variablen gerendert.
  registrationEnabled: true
  passkeyLoginEnabled: true
  passkeyRegistrationEnabled: true

# Datenbank. Bei postgresql.enabled bezieht der Chart DATABASE_URL aus dem
# generierten Secret (siehe oben) und rollt zusätzlich eine eigene,
# einfache Postgres-Instanz aus. Für eine externe/gemanagte Datenbank:
# postgresql.enabled auf false setzen und externalDatabase.* + ein
# existingSecret mit der fertigen Verbindungs-URL angeben (siehe
# examples/values-production.yaml). Dieselbe externalDatabase.existingSecret/
# existingSecretUrlKey-Kombination lässt sich auch BEI postgresql.enabled:
# true setzen — dann bleibt die gebündelte Instanz, nur mit selbst
# mitgebrachter URL/Passwort statt generiert (siehe postgresql.auth.existingSecret
# unten und README "Secrets").
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
  # UID/GID 70 = der "postgres"-User, den postgres:17-alpine fest eingebaut
  # hat (`docker run --rm --entrypoint id postgres:17-alpine` bzw. `getent
  # passwd postgres` im Image). Direkt als dieser User starten (statt als
  # root, von wo das Image-Entrypoint-Skript selbst per `gosu` zu postgres
  # wechseln würde) ist für die Pod Security Standard "restricted" nötig —
  # das Skript erkennt einen bereits nicht-root laufenden Aufruf und
  # überspringt den gosu-Schritt ersatzlos.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  auth:
    username: barynt
    database: barynt
    # Passwort der gebündelten Instanz — existingSecret gesetzt -> wird
    # unverändert an den Postgres-Container durchgereicht (reiner Verweis,
    # kein `lookup`). ACHTUNG: landet NICHT automatisch in DATABASE_URL —
    # eine daraus zusammengesetzte URL bräuchte den Klartext-Wert zur
    # Render-Zeit, was unter GitOps (ArgoCD/Flux rendern immer per
    # `helm template`, nie mit Cluster-Zugriff) das Rendern selbst bricht,
    # nicht nur die Rotation. Deshalb Pflicht in Kombination mit
    # externalDatabase.existingSecret/existingSecretUrlKey (fertige URL,
    # gleiches Passwort, vom Betreiber mitgebracht) — ohne das bricht
    # `helm template` bewusst mit einer klaren Fehlermeldung statt einer
    # kaputten DATABASE_URL. existingSecret leer -> der Chart generiert
    # Passwort und DATABASE_URL einmalig selbst, wie bisher.
    existingSecret: ""
    existingSecretPasswordKey: password
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

externalDatabase:
  # Secret mit der fertigen Verbindungs-URL (Key s.u.) — siehe README
  # "Externe Datenbank". Bei postgresql.enabled: false ersetzt das die
  # gebündelte Instanz durch eine andere Datenbank. Bei postgresql.enabled:
  # true (zusammen mit postgresql.auth.existingSecret) bleibt es dieselbe
  # gebündelte Instanz, nur mit selbst mitgebrachtem Passwort/URL statt
  # generiert — die StatefulSet läuft in beiden Fällen unverändert, nur
  # DATABASE_URL kommt dann von hier statt aus dem generierten Secret.
  existingSecret: ""
  existingSecretUrlKey: ""

# Redis (Rate-Limit-Zähler der öffentlichen API) — wie im bestehenden
# docker-compose.yml ohne Auth, siehe README für die Begründung.
# enabled: false ohne externalRedis.host lässt der Chart nicht durch (reiner
# Werte-Check zur Render-Zeit, kein Cluster-Zugriff nötig) — sonst würde
# REDIS_URL auf eine nicht existierende Instanz zeigen.
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  # UID 999 / GID 1000 = der "redis"-User, den redis:7-alpine fest eingebaut
  # hat (per `getent passwd redis` im Image geprüft) — anders als bei
  # Postgres hier kein root-Vorlauf im Entrypoint, direktes Starten als
  # dieser User funktioniert ohne Weiteres.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

externalRedis:
  host: ""
  port: 6379

# S3-kompatibler Objektspeicher (Avatare, Anhänge). Ohne S3_ENDPOINT bleiben
# Uploads clientseitig einfach aus (wie in `lib/storage` dokumentiert) —
# rustfs.enabled bündelt stattdessen einen selbst gehosteten Ersatz.
s3:
  region: us-east-1
  bucketAvatars: avatars
  bucketIssues: issues
  # Nur nötig für externen S3 (rustfs.enabled: false). Keys: accessKeyId,
  # secretAccessKey. Pflicht, sobald endpoint gesetzt ist und rustfs.enabled:
  # false — sonst lässt der Chart das gar nicht erst rendern (reiner
  # Werte-Check), statt erst beim Rollout mit CreateContainerConfigError zu
  # scheitern.
  existingSecret: ""
  existingSecretAccessKeyIdKey: "accessKeyId"
  existingSecretSecretAccessKeyKey: "secretAccessKey"
  endpoint: ""
  publicEndpoint: ""

# Kein offizielles Helm-Chart für RustFS vorhanden (siehe verlinkte
# Recherche im Ticket) — dieses minimale Deployment+PVC bildet exakt ab,
# was docker-compose.yml heute mit `rustfs`+`rustfs-init` tut.
rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: latest
  # UID/GID 10001 = der "rustfs"-User, den rustfs/rustfs:latest fest
  # eingebaut hat (per `getent passwd rustfs` im Image geprüft).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  service:
    apiPort: 9000
    consolePort: 9001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# SMTP ist optional — ohne smtp.host verschickt die Anwendung keine Mails
# (siehe lib/mail), alle Wege bleiben funktional (Einladungslink zum
# Kopieren, In-App-Benachrichtigungen).
smtp:
  host: ""
  port: 587
  secure: false
  user: ""
  from: ""
  existingSecret: ""
  existingSecretKey: "password"
  companyName: ""
  companyAddress: ""

# Migrations-Job (Helm-Hook, siehe templates/migration-job.yaml) — Backoff
# bewusst 0: eine fehlgeschlagene Migration soll einen Menschen holen, nicht
# automatisch erneut versuchen.
migration:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Generische Escape-Hatches für alles, was der Chart nicht selbst abbildet
# (z. B. ein interner CA-Trust-Anchor, ein Split-Horizon-DNS-Eintrag für
# einen internen IdP) — werden unverändert an alle Container des Pods
# durchgereicht (app, migrate-initContainer, rustfs-init), da migrate und
# rustfs-init dieselbe Datenbank/denselben Endpunkt ansprechen und damit
# praktisch immer dieselbe Konfiguration brauchen. extraVolumes hängt schon
# am Pod und gilt damit ohnehin für alle Container. Bleiben bewusst generisch
# statt eine konkrete Installation (z. B. einen bestimmten IdP-Hostnamen)
# fest zu verdrahten.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
hostAliases: []
