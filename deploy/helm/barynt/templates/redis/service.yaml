{{- if and .Values.redis.enabled (not .Values.externalRedis.host) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "barynt.fullname" . }}-redis
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "barynt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
