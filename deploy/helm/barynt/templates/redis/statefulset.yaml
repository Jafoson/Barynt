{{- if and .Values.redis.enabled (not .Values.externalRedis.host) }}
{{/*
Ohne Auth, exakt wie der `redis`-Service in docker-compose.yml — Redis
hält hier ausschließlich Rate-Limit-Zähler der öffentlichen API
(lib/api/rateLimit.ts), keine sensiblen Daten. Für andere Anforderungen:
externalRedis.host auf eine eigene, abgesicherte Instanz zeigen lassen.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "barynt.fullname" . }}-redis
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "barynt.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "barynt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "barynt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      {{- if not .Values.redis.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.persistence.storageClassName }}
        storageClassName: {{ .Values.redis.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- end }}
{{- end }}
