{{- if and .Values.postgresql.enabled (not .Values.externalDatabase.existingSecretUrlKey) }}
{{/*
Bewusst kein externes Chart (Bitnami o.ä.) als Abhängigkeit — die meisten
Bitnami-Charts liegen seit September 2025 hinter einer kommerziellen
Broadcom-Subscription, ein freier Fork hat sich zum Zeitpunkt der Recherche
noch nicht als neuer Standard etabliert. Für eine Single-Instance-Datenbank
ohne Hochverfügbarkeitsanspruch (dieselbe Erwartung wie das bisherige
docker-compose.yml) reicht eine eigene, minimale StatefulSet — siehe
README.md "Warum keine Bitnami-Subcharts".
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "barynt.fullname" . }}-postgres
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "barynt.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "barynt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "barynt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        {{- toYaml .Values.postgresql.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          securityContext:
            {{- toYaml .Values.postgresql.securityContext | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Nicht der Mountpoint selbst (der existiert schon, angelegt vom
            # Volume-Provisioner als root — `chmod`/`chown` darauf scheitert
            # als non-root ohne CAP_FOWNER/CAP_CHOWN, beide unter Restricted
            # PSS nicht verfügbar, `fsGroup` ändert nur die Gruppe, nie den
            # Owner). Ein noch nicht existierendes Unterverzeichnis lässt
            # `initdb` selbst per `mkdir` anlegen — dessen Owner ist dann
            # automatisch der aufrufende Prozess (uid 70), das nachfolgende
            # `chmod 0700` (das `initdb` immer ausführt) greift also auf
            # eigenen Besitz zu und braucht keine Capability. Siehe die
            # offizielle Doku des postgres-Images ("PGDATA", Abschnitt zu
            # Non-root-Volumes) für dasselbe Muster.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "barynt.generatedSecretName" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.persistence.storageClassName }}
        storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}
