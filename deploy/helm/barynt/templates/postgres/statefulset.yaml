{{- if and .Values.postgresql.enabled (not .Values.externalDatabase.existingSecretUrlKey) }}
{{/*
Bewusst kein externes Chart (Bitnami o.ä.) als Abhängigkeit — die meisten
Bitnami-Charts liegen seit September 2025 hinter einer kommerziellen
Broadcom-Subscription, ein freier Fork hat sich zum Zeitpunkt der Recherche
noch nicht als neuer Standard etabliert. Für eine Single-Instance-Datenbank
ohne Hochverfügbarkeitsanspruch (dieselbe Erwartung wie das bisherige
docker-compose.yml) reicht eine eigene, minimale StatefulSet — siehe
README.md "Warum keine Bitnami-Subcharts".
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "barynt.fullname" . }}-postgres
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "barynt.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "barynt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "barynt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "barynt.generatedSecretName" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}, "-d", {{ .Values.postgresql.auth.database | quote }}]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgresql.persistence.storageClassName }}
        storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
  {{- end }}
{{- end }}
