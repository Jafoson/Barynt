apiVersion: v1
kind: Pod
metadata:
  name: {{ include "barynt.fullname" . }}-test-connection
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: wget
      image: busybox:1.36
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command: ["wget"]
      args: ["-qO-", "http://{{ include "barynt.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}"]
  restartPolicy: Never
