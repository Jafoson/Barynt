{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "barynt.fullname" . }}-rustfs
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  ports:
    - port: {{ .Values.rustfs.service.apiPort }}
      targetPort: api
      name: api
    - port: {{ .Values.rustfs.service.consolePort }}
      targetPort: console
      name: console
  selector:
    {{- include "barynt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
{{- end }}
