{{/*
Nicht-sensible Env-Vars der App — Zugangsdaten und die zusammengesetzte
DATABASE_URL/S3-Keys kommen aus Secrets (siehe deployment.yaml),
nicht von hier.
*/}}
{{- if and (not .Values.redis.enabled) (not .Values.externalRedis.host) }}
{{- fail "redis.enabled: false gesetzt, aber externalRedis.host fehlt — REDIS_URL würde auf eine nicht existierende Instanz zeigen (barynt.redisUrl), siehe README \"Externe Datenbank/Redis/S3\"." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "barynt.fullname" . }}-env
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  HOSTNAME: "0.0.0.0"
  PORT: "3000"
  REDIS_URL: {{ include "barynt.redisUrl" . | quote }}
  {{- if .Values.env.authUrl }}
  AUTH_URL: {{ .Values.env.authUrl | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.issuer }}
  AUTH_OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  AUTH_OIDC_CLIENT_ID: {{ .Values.auth.oidc.clientId | quote }}
  {{- if .Values.auth.oidc.name }}
  AUTH_OIDC_NAME: {{ .Values.auth.oidc.name | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.auth.registrationEnabled }}
  AUTH_REGISTRATION_ENABLED: "false"
  {{- end }}
  {{- if not .Values.auth.passkeyLoginEnabled }}
  AUTH_PASSKEY_LOGIN_ENABLED: "false"
  {{- end }}
  {{- if not .Values.auth.passkeyRegistrationEnabled }}
  AUTH_PASSKEY_REGISTRATION_ENABLED: "false"
  {{- end }}
  {{- if or .Values.s3.endpoint .Values.rustfs.enabled }}
  S3_ENDPOINT: {{ include "barynt.s3Endpoint" . | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.s3.publicEndpoint | default (include "barynt.s3Endpoint" .) | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_BUCKET_AVATARS: {{ .Values.s3.bucketAvatars | quote }}
  S3_BUCKET_ISSUES: {{ .Values.s3.bucketIssues | quote }}
  {{- end }}
  {{- if .Values.smtp.host }}
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_SECURE: {{ .Values.smtp.secure | quote }}
  {{- if .Values.smtp.user }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  {{- end }}
  {{- if .Values.smtp.from }}
  SMTP_FROM: {{ .Values.smtp.from | quote }}
  {{- end }}
  {{- if .Values.smtp.companyName }}
  MAIL_COMPANY_NAME: {{ .Values.smtp.companyName | quote }}
  {{- end }}
  {{- if .Values.smtp.companyAddress }}
  MAIL_COMPANY_ADDRESS: {{ .Values.smtp.companyAddress | quote }}
  {{- end }}
  {{- end }}
