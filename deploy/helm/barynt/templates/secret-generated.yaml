{{/*
Ein Secret für jeden Wert, den der Chart mangels existingSecret selbst
erzeugt — nie im Klartext in values.yaml/Release-History, siehe README
"Secrets". `lookup` liest ein evtl. schon vorhandenes Secret zuerst: einmal
generiert, bleibt der Wert über `helm upgrade` hinweg stabil, statt bei
jedem Rollout einen neuen Login-/DB-Zustand zu erzeugen.

`lookup` liefert bei einem "helm template"/"helm install --dry-run" immer
ein leeres Ergebnis (kein Cluster-Zugriff) — in dem Fall wird frisch
generiert, was für Lint/CI ausreicht, aber KEIN Vorschau-Wert für einen
echten Cluster ist.

Bewusst `if/else` statt Sprigs `ternary`: `ternary` wertet immer beide Seiten
aus, auch die nicht gewählte — `index $data "POSTGRES_PASSWORD" | b64dec"`
bricht dann mit "invalid value; expected string", sobald der Key beim
ersten Install noch gar nicht existiert.
*/}}
{{- $secretName := include "barynt.generatedSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- end }}

{{- $authSecret := "" }}
{{- if not .Values.auth.existingSecret }}
{{- if hasKey $data "AUTH_SECRET" }}
{{- $authSecret = index $data "AUTH_SECRET" }}
{{- else }}
{{- $authSecret = randAlphaNum 48 | b64enc }}
{{- end }}
{{- end }}

{{/*
postgresql.auth.existingSecret setzt ein Passwort, das der Chart nicht
kennt — eine daraus zusammengesetzte DATABASE_URL bräuchte den
Klartext-Wert zur Render-Zeit (per `lookup`), und `lookup` ist unter
GitOps (ArgoCD/Flux rendern immer per `helm template`, nie mit
Cluster-Zugriff) IMMER leer. Das schon einmal versucht: das Secret bricht
dann nicht "nur" die Rotation, sondern das Rendern selbst, jedes Mal —
schlimmer als der Ausgangszustand. Deshalb hier ein reiner Werte-Check
(kein `lookup`, feuert identisch unter `helm template` wie unter
`helm install`): wer ein eigenes Postgres-Passwort will, muss zusätzlich
externalDatabase.existingSecret/existingSecretUrlKey setzen und die
fertige DATABASE_URL selbst mitbringen (siehe README "Secrets") — der
Chart komponiert sie dann gar nicht mehr, siehe die Bedingung direkt
darunter.
*/}}
{{- if and .Values.postgresql.auth.existingSecret (not .Values.externalDatabase.existingSecretUrlKey) }}
{{- fail (printf "postgresql.auth.existingSecret gesetzt, aber externalDatabase.existingSecret/existingSecretUrlKey fehlt — die DATABASE_URL kann nicht ohne Cluster-Zugriff zusammengesetzt werden, siehe README \"Secrets\".") }}
{{- end }}

{{- $pgPassword := "" }}
{{- $databaseUrl := "" }}
{{- if not .Values.externalDatabase.existingSecretUrlKey }}
{{- $pgPasswordPlain := "" }}
{{- if hasKey $data "POSTGRES_PASSWORD" }}
{{- $pgPasswordPlain = index $data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pgPasswordPlain = randAlphaNum 32 }}
{{- end }}
{{- $pgPassword = $pgPasswordPlain | b64enc }}
{{- $pgHost := printf "%s-postgres" (include "barynt.fullname" .) }}
{{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $pgPasswordPlain $pgHost .Values.postgresql.auth.database | b64enc }}
{{- end }}

{{- $s3AccessKey := "" }}
{{- $s3SecretKey := "" }}
{{- if and .Values.rustfs.enabled (not .Values.s3.existingSecret) }}
{{- if hasKey $data "S3_ACCESS_KEY_ID" }}
{{- $s3AccessKey = index $data "S3_ACCESS_KEY_ID" }}
{{- else }}
{{- $s3AccessKey = randAlphaNum 20 | b64enc }}
{{- end }}
{{- if hasKey $data "S3_SECRET_ACCESS_KEY" }}
{{- $s3SecretKey = index $data "S3_SECRET_ACCESS_KEY" }}
{{- else }}
{{- $s3SecretKey = randAlphaNum 40 | b64enc }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
  annotations:
    # Übersteht `helm uninstall` absichtlich nicht — ein Redeploy soll neue
    # Zugangsdaten erzeugen dürfen, nicht an alten hängen bleiben, die es im
    # Cluster gar nicht mehr gibt.
    helm.sh/resource-policy: ""
type: Opaque
data:
  {{- if $authSecret }}
  AUTH_SECRET: {{ $authSecret }}
  {{- end }}
  {{- if $pgPassword }}
  POSTGRES_PASSWORD: {{ $pgPassword }}
  {{- end }}
  {{- if $databaseUrl }}
  DATABASE_URL: {{ $databaseUrl }}
  {{- end }}
  {{- if $s3AccessKey }}
  S3_ACCESS_KEY_ID: {{ $s3AccessKey }}
  S3_SECRET_ACCESS_KEY: {{ $s3SecretKey }}
  {{- end }}
