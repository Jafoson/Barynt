{{/*
Migrationen laufen im App-Container selbst: das Image führt beim Start
`prisma migrate deploy` und `prisma/bootstrap.ts` aus (docker/entrypoint.sh),
bevor der Server hochfährt — ein Update ist nur ein anderes Image-Tag. Es
gibt weder ein separates Migrate-Image noch einen Hook-Job oder initContainer
dafür: ein pre-install-Hook liefe vor allen normalen Chart-Ressourcen, bei der
allerersten Installation gäbe es die gebündelte Postgres-StatefulSet noch gar
nicht. Prismas `migrate deploy` ist über eine Advisory-Lock idempotent und
nebenläufig-sicher (mehrere Replicas dürfen gleichzeitig starten),
`prisma/bootstrap.ts` nutzt `skipDuplicates` — beide vertragen es
problemlos, bei jedem Rollout erneut zu laufen. Der startupProbe der App
gibt ihnen die Zeit.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "barynt.fullname" . }}
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "barynt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "barynt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "barynt.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.rustfs.enabled (not .Values.s3.existingSecret) }}
      initContainers:
        - name: rustfs-init
          # Gleiches Image wie der `rustfs-init`-Service in docker-compose.yml:
          # legt die beiden Buckets an und setzt die CORS-Policy, die
          # Presigned-Upload-URLs aus dem Browser erfordern. `|| true` macht
          # den Schritt sicher wiederholbar, wie im Compose-Pendant.
          image: amazon/aws-cli:latest
          # Gleicher Container-securityContext wie die App — die
          # runAsUser/-Group des Pods (Values.podSecurityContext, uid/gid
          # 1000) reichen: aws-cli braucht keinen bestimmten UID/GID, läuft
          # unter jeder nicht-root-UID unverändert (per `docker run --user
          # 1000:1000 ... aws --version` geprüft), im Gegensatz zu
          # Postgres/Redis/RustFS unten mit ihrem jeweils fest eingebauten
          # Service-User.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -e
              for i in $(seq 1 30); do
                (echo > /dev/tcp/{{ include "barynt.fullname" . }}-rustfs/{{ .Values.rustfs.service.apiPort }}) >/dev/null 2>&1 && break
                echo "warte auf rustfs ($i/30)"; sleep 2
              done
              endpoint="http://{{ include "barynt.fullname" . }}-rustfs:{{ .Values.rustfs.service.apiPort }}"
              cors='{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}'
              aws --endpoint-url "$endpoint" s3 mb "s3://{{ .Values.s3.bucketAvatars }}" || true
              aws --endpoint-url "$endpoint" s3 mb "s3://{{ .Values.s3.bucketIssues }}" || true
              aws --endpoint-url "$endpoint" s3api put-bucket-cors --bucket "{{ .Values.s3.bucketAvatars }}" --cors-configuration "$cors" || true
              aws --endpoint-url "$endpoint" s3api put-bucket-cors --bucket "{{ .Values.s3.bucketIssues }}" --cors-configuration "$cors" || true
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  {{- include "barynt.s3AccessKeyRef" . | nindent 18 }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "barynt.s3SecretKeyRef" . | nindent 18 }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.s3.region | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
        {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ include "barynt.fullname" . }}-env
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  {{- include "barynt.authSecretRef" . | nindent 18 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- include "barynt.databaseUrlRef" . | nindent 18 }}
            {{- if and .Values.auth.oidc.issuer .Values.auth.oidc.existingSecret }}
            - name: AUTH_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.existingSecretKey | default "clientSecret" }}
            {{- end }}
            {{- if or .Values.s3.endpoint .Values.rustfs.enabled }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  {{- include "barynt.s3AccessKeyRef" . | nindent 18 }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "barynt.s3SecretKeyRef" . | nindent 18 }}
            {{- end }}
            {{- if and .Values.smtp.host .Values.smtp.existingSecret }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.existingSecret }}
                  key: {{ .Values.smtp.existingSecretKey | default "password" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # `/api/health/live` (nur der Prozess) für Liveness, `/api/health`
          # (Datenbank erreichbar) für Readiness und Startup — siehe
          # values.yaml `probes`. `probes.path` überschreibt beide.
          # Hält Liveness/Readiness zurück, solange der Container beim Start noch
          # die Datenbank migriert (siehe Kommentar oben).
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path | default .Values.probes.readinessPath }}
              port: http
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path | default .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path | default .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
