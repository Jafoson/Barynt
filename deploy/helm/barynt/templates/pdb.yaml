{{/*
Hält bei einem Node-Drain oder Cluster-Upgrade mindestens eine App-Replica am
Leben. Nur bei mehr als einer Replica — mit einer einzigen würde
`minAvailable: 1` jeden Drain für immer blockieren.
*/}}
{{- if and .Values.podDisruptionBudget.enabled (include "barynt.multiReplica" .) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "barynt.fullname" . }}
  labels:
    {{- include "barynt.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "barynt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
{{- end }}
